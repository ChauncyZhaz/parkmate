<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>申请人页面预览 - ParkingSpot</title>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(165deg, #4f46e5 0%, #3b82f6 46%, #0ea5e9 100%);
      min-height: 100vh;
      padding: clamp(14px, 4vw, 24px);
      padding-top: calc(clamp(14px, 4vw, 24px) + var(--sat));
      padding-bottom: calc(clamp(20px, 5vw, 28px) + var(--sab));
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: -1; opacity: .35;
      background-image:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.5) 0, transparent 42%),
        radial-gradient(circle at 82% 78%, rgba(255,255,255,.28) 0, transparent 46%);
    }
    .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: clamp(10px, 2.6vw, 14px); }
    .card {
      background: rgba(255,255,255,.97);
      border-radius: clamp(18px, 4.5vw, 24px);
      box-shadow: 0 12px 36px rgba(23, 42, 106, .22);
    }
    .head { padding: clamp(20px, 5vw, 28px) clamp(18px, 4.5vw, 26px); text-align: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #eef2ff; color: #4338ca;
      border: 1px solid #c7d2fe;
      padding: 5px 12px; border-radius: 999px;
      font-size: 12.5px; font-weight: 700; letter-spacing: .02em;
    }
    .head h1 { font-size: clamp(20px, 5.4vw, 26px); color: #1e293b; margin: 14px 0 8px; line-height: 1.3; }
    .head h1 span { color: #4f46e5; }
    .head .note { font-size: 13.5px; color: #718096; line-height: 1.65; max-width: 30em; margin: 0 auto; }
    .free-tag {
      margin-top: 14px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
      font-size: 12.5px; color: #0f766e; font-weight: 600;
    }
    .free-tag span { display: inline-flex; align-items: center; gap: 4px; }
    .field { padding: 16px 20px; }
    .field + .field { border-top: 1px solid #e6ecf5; }
    .label {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      font-size: 14.5px; font-weight: 700; color: #334155; margin-bottom: 12px;
    }
    .label .req { color: #ef4444; font-weight: 700; margin-left: 2px; }
    .label .sub { font-size: 11.5px; color: #a0aec0; font-weight: 500; }
    .chips { display: flex; flex-wrap: wrap; gap: 9px; }
    .chip {
      flex: 1 1 calc(50% - 9px); min-height: 46px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      border: 1.5px solid #dfe7f3; background: #f8fafc; color: #475569;
      border-radius: 14px; font-size: 14.5px; font-weight: 600;
    }
    .chip.on {
      border-color: #4f46e5; background: linear-gradient(135deg, #eef2ff, #e0f2fe);
      color: #3730a3; box-shadow: 0 4px 14px rgba(79,70,229,.16);
    }
    .chip.sm { flex: 1 1 auto; padding: 0 14px; min-height: 42px; font-size: 13.5px; }
    .text-input {
      width: 100%; height: 48px; padding: 0 14px;
      border: 1.5px solid #dfe7f3; border-radius: 13px;
      background: #fff; color: #1e293b; font-size: 16px; font-family: inherit; outline: none;
    }
    .text-input::placeholder { color: #a0aec0; }
    .note-input {
      width: 100%; padding: 12px 14px; font-size: 15px; line-height: 1.5; min-height: 72px;
      border: 1.5px solid #dfe7f3; border-radius: 13px; resize: none;
      background: #fff; color: #1e293b; font-family: inherit; outline: none;
    }
    .note-input::placeholder { color: #a0aec0; }
    .submit {
      margin-top: 6px;
      background: linear-gradient(135deg, #4f46e5 0%, #0ea5e9 100%);
      color: #fff; border: none; width: 100%; min-height: 56px;
      border-radius: 18px; font-size: 17px; font-weight: 700; font-family: inherit;
      box-shadow: 0 12px 30px rgba(37, 99, 235, .4);
      display: flex; align-items: center; justify-content: center; gap: 9px;
    }
    .foot-note {
      text-align: center; font-size: 12.5px; color: rgba(255,255,255,.9);
      line-height: 1.7; text-shadow: 0 1px 4px rgba(12,30,70,.3); padding: 0 10px;
    }
    .preview-badge {
      position: fixed; top: 10px; right: 10px; z-index: 1000;
      background: rgba(0,0,0,.65); color: #fff;
      padding: 7px 14px; border-radius: 20px; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="preview-badge">申请人页面预览</div>

  <div class="wrap">
    <div class="card head">
      <div class="badge">🅿️ B2-078 私家车位</div>
      <h1>想临时停一下？<br><span>跟车主说一声就行</span></h1>
      <p class="note">本车位为私家车位，可临时借用，请先申请并留下联系方式</p>
      <div class="free-tag">
        <span>⏱ 临时占用</span>
        <span>📞 留个电话</span>
        <span>🤝 到点挪车</span>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <div class="label"><span>占用多久<span class="req">*</span></span><span class="sub">到点请挪车</span></div>
        <div class="chips">
          <div class="chip">30 分钟</div>
          <div class="chip on">1 小时</div>
          <div class="chip">2 小时</div>
          <div class="chip">4 小时</div>
          <div class="chip">⏱ 自定义</div>
        </div>
      </div>

      <div class="field">
        <div class="label"><span>占用原因<span class="req">*</span></span><span class="sub">选一个或自己写</span></div>
        <div class="chips">
          <div class="chip sm on">临时停一下</div>
          <div class="chip sm">接人送人</div>
          <div class="chip sm">上楼取东西</div>
          <div class="chip sm">吃饭买东西</div>
          <div class="chip sm">装货卸货</div>
          <div class="chip sm">车坏了等救援</div>
        </div>
        <div style="margin-top:10px">
          <input class="text-input" type="text" placeholder="补充说明，例如：上楼取个东西">
        </div>
      </div>

      <div class="field">
        <div class="label"><span>车牌号<span class="sub">（可选）</span></span><span class="sub">方便车主核对</span></div>
        <input class="text-input" type="text" placeholder="例如：粤A12345">
      </div>

      <div class="field">
        <div class="label"><span>联系电话<span class="req">*</span></span><span class="sub">仅车主可见</span></div>
        <input class="text-input" type="tel" placeholder="11 位手机号">
      </div>

      <div class="field">
        <div class="label"><span>更多说明<span class="sub">（可选）</span></span></div>
        <textarea class="note-input" placeholder="例如：只停 40 分钟，接孩子就走"></textarea>
      </div>
    </div>

    <button class="submit"><span>📨</span><span>发送借用申请</span></button>

    <p class="foot-note">提交后请停留本页，车主同意会实时显示<br>离开后重新扫码也能继续查看</p>
  </div>
</body>
</html>
