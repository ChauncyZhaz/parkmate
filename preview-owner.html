<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>车主页面预览 - ParkingSpot</title>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(165deg, #0f172a 0%, #134e4a 52%, #0e7490 100%);
      min-height: 100vh;
      padding: clamp(14px, 4vw, 24px);
      padding-top: calc(clamp(14px, 4vw, 24px) + var(--sat));
      padding-bottom: calc(clamp(20px, 5vw, 28px) + var(--sab));
      display: flex; justify-content: center; align-items: flex-start;
    }
    .wrap { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: clamp(10px, 2.6vw, 14px); }
    .card {
      background: rgba(255,255,255,.98);
      border-radius: clamp(18px, 4.5vw, 24px);
      box-shadow: 0 14px 40px rgba(3, 20, 30, .35);
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 4px 4px 0; color: #e2e8f0;
    }
    .topbar .t { font-size: 15px; font-weight: 700; }
    .topbar .s { font-size: 12px; color: #94a3b8; }
    .refresh {
      border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.1);
      color: #e2e8f0; border-radius: 999px; padding: 8px 14px;
      font-size: 12.5px; font-weight: 600; font-family: inherit; min-height: 38px;
    }
    .detail-head { padding: clamp(20px, 5vw, 26px) clamp(18px, 4.5vw, 24px); text-align: center; }
    .spot-pill {
      display: inline-block; background: #ccfbf1; color: #115e59;
      border: 1px solid #99f6e4; border-radius: 999px;
      padding: 5px 13px; font-size: 12.5px; font-weight: 700;
    }
    .detail-head h1 { font-size: clamp(19px, 5vw, 24px); color: #0f172a; margin: 12px 0 6px; }
    .detail-head .time { font-size: 12.5px; color: #64748b; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 0 clamp(16px, 4vw, 22px) clamp(16px, 4vw, 20px); }
    .cell { background: #f8fafc; border: 1px solid #eef2f7; border-radius: 13px; padding: 11px 13px; }
    .cell.wide { grid-column: 1 / -1; }
    .cell .k { font-size: 11px; color: #94a3b8; font-weight: 700; letter-spacing: .02em; }
    .cell .v { font-size: 15px; color: #1e293b; font-weight: 700; margin-top: 3px; word-break: break-all; }
    .cell .v.big { font-size: 17px; color: #0f766e; }
    .phone-row { display: flex; align-items: center; gap: 10px; padding: 0 clamp(16px, 4vw, 22px) clamp(16px, 4vw, 20px); }
    .phone-box {
      flex: 1; display: flex; align-items: center; gap: 10px;
      background: #eff6ff; border: 1px solid #dbeafe; border-radius: 14px; padding: 12px 14px;
    }
    .phone-box .n { font-size: 16px; font-weight: 800; color: #1d4ed8; letter-spacing: .04em; }
    .phone-box .h { font-size: 11px; color: #60a5fa; }
    .btn-call {
      flex-shrink: 0; text-decoration: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff;
      border-radius: 13px; padding: 0 18px; min-height: 48px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 14px; font-weight: 700;
    }
    .section { padding: 16px 20px; }
    .section + .section { border-top: 1px solid #e6ecf5; }
    .sec-title { font-size: 13.5px; font-weight: 700; color: #334155; margin-bottom: 11px; }
    .sec-title .hint { font-size: 11.5px; color: #a0aec0; font-weight: 500; }
    .note-box {
      background: #fffbeb; border: 1px solid #fde68a; border-radius: 13px;
      padding: 11px 13px; font-size: 13.5px; color: #92400e; line-height: 1.6;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1.5px solid #dfe7f3; background: #f8fafc; color: #475569;
      border-radius: 12px; padding: 0 14px; min-height: 42px;
      font-size: 13px; font-weight: 700; font-family: inherit;
      display: flex; align-items: center; gap: 5px;
    }
    .chip.on { border-color: #0d9488; background: #ccfbf1; color: #115e59; }
    .actions { display: flex; gap: 10px; padding: 16px 20px; }
    .btn {
      flex: 1; border: none; border-radius: 15px; min-height: 56px;
      font-size: 16px; font-weight: 800; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-approve { background: linear-gradient(135deg, #10b981, #059669); color: #fff; box-shadow: 0 10px 26px rgba(16,185,129,.35); }
    .btn-decline { flex: 0 0 34%; background: #fff1f2; color: #be123c; border: 1.5px solid #fecdd3; }
    .preview-badge {
      position: fixed; top: 10px; right: 10px; z-index: 1000;
      background: rgba(0,0,0,.65); color: #fff;
      padding: 7px 14px; border-radius: 20px; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="preview-badge">车主页面预览</div>

  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="t">🅿️ 车位管理</div>
        <div class="s">车辆进出，尽在掌握</div>
      </div>
      <button class="refresh">刷新</button>
    </div>

    <div class="card">
      <div class="detail-head">
        <div class="spot-pill">B2-078 私家车位</div>
        <h1>苏A12345 想借用 1 小时</h1>
        <div class="time">提交于 14:20 · 申请 1 小时</div>
      </div>

      <div class="grid">
        <div class="cell wide"><div class="k">占用时长</div><div class="v big">1 小时</div></div>
        <div class="cell wide"><div class="k">原因</div><div class="v big">上楼取东西</div></div>
        <div class="cell"><div class="k">车牌</div><div class="v">苏A12345</div></div>
        <div class="cell"><div class="k">状态</div><div class="v">等待你处理</div></div>
      </div>

      <div class="phone-row">
        <div class="phone-box">
          <div style="flex:1">
            <div class="n">138 **** 8000</div>
            <div class="h">仅你可见，勿外传</div>
          </div>
        </div>
        <a class="btn-call" href="#">📞 拨打</a>
      </div>

      <div class="section">
        <div class="sec-title"><span>对方补充</span></div>
        <div class="note-box">只停两小时，取完东西就下来，谢谢！</div>
      </div>

      <div class="section">
        <div class="sec-title"><span>批准时长</span><span class="hint">可改，默认按对方申请</span></div>
        <div class="chips">
          <div class="chip">30 分钟</div>
          <div class="chip on">按申请 1 小时</div>
          <div class="chip">2 小时</div>
          <div class="chip">4 小时</div>
        </div>
      </div>

      <div class="section">
        <div class="sec-title"><span>快捷回复（会一起发给对方）</span></div>
        <div class="chips">
          <div class="chip">可以，注意别超时</div>
          <div class="chip">停吧，我晚上才回来</div>
          <div class="chip">可以，麻烦留个电话</div>
          <div class="chip">我马上要用车，麻烦快点</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-decline">不方便</button>
        <button class="btn btn-approve">✅ 同意借用</button>
      </div>
    </div>
  </div>
</body>
</html>
