name = "parkmate"
main = "worker.js"
compatibility_date = "2024-11-01"

# KV 绑定：故意不写 id。
# Wrangler 4.45+ 会在首次部署时自动创建这个 namespace（名称以 worker 名开头，
# 例如 parkmate-PARKING_KV），之后每次部署自动复用，数据不会丢。
# 这样别人 fork 之后不需要填写任何账号专属的 id。
# 如果你已有现成的 KV 想复用，就在下面追加一行：id = "你的 namespace id"
[[kv_namespaces]]
binding = "PARKING_KV"

[vars]
SPOT_NAME = "私家车位"
SPOT_NOTE = "本车位为私家车位，可临时借用，请先申请并留下联系方式"

# 敏感变量建议用 `wrangler secret put OWNER_PHONE` 设置，或去 Cloudflare 后台配
# OWNER_PHONE = "138xxxxxxxx"

# 车主台凭证：必填，至少 8 位。不配的话 /owner 和所有 /api/owner/* 会返回 503。
# 用 `wrangler secret put OWNER_TOKEN` 设置（不要写在这个文件里提交到仓库）
# OWNER_TOKEN = ""

# 推送渠道（配一个就行）
# BARK_URL = "https://api.day.app/你的key"
# PUSHPLUS_TOKEN = ""
# PUSHPLUS_TOPIC = ""
# WXPUSHER_TOKEN = ""
# WXPUSHER_UIDS = ""
# WXPUSHER_TOPIC_IDS = ""
